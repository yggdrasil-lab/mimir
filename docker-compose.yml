version: "3.8"

networks:
  aether-net:
    external: true
  internal:
    driver: overlay
    attachable: true

services:
  docs:
    image: ${REGISTRY_PREFIX}mimir:latest
    build:
      context: .
      dockerfile: Dockerfile
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.mimir-docs.rule=Host(`docs.${DOMAIN_NAME}`)"
        - "traefik.http.routers.mimir-docs.entrypoints=websecure"
        - "traefik.http.routers.mimir-docs.tls.certresolver=cloudflare"
        - "traefik.http.routers.mimir-docs.middlewares=authelia"
        - "traefik.http.services.mimir-docs.loadbalancer.server.port=8080"
        - "homepage.group=Management"
        - "homepage.name=Docs"
        - "homepage.icon=book-open-page-variant.png"
        - "homepage.href=https://docs.${DOMAIN_NAME}"
        - "homepage.description=Infrastructure & Service Documentation"
    volumes:
      - ${OBSIDIAN_VAULT_PATH}/second-brain/Areas/90-Infrastructure:/usr/src/app/content:ro
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - BASE_URL=docs.${DOMAIN_NAME}
      - PAGE_TITLE=Mimir | Docs
      - CI=true
    networks:
      - aether-net
      - internal

  wiki:
    image: ${REGISTRY_PREFIX}mimir:latest
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.mimir-wiki.rule=Host(`wiki.${DOMAIN_NAME}`)"
        - "traefik.http.routers.mimir-wiki.entrypoints=websecure"
        - "traefik.http.routers.mimir-wiki.tls.certresolver=cloudflare"
        - "traefik.http.services.mimir-wiki.loadbalancer.server.port=8080"
        - "homepage.group=Management"
        - "homepage.name=Wiki"
        - "homepage.icon=wikipedia.png"
        - "homepage.href=https://wiki.${DOMAIN_NAME}"
        - "homepage.description=Public Knowledge Base & Reference Wiki"
    volumes:
      - ${OBSIDIAN_VAULT_PATH}/second-brain/References:/usr/src/app/content:ro
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - BASE_URL=wiki.${DOMAIN_NAME}
      - PAGE_TITLE=Mimir | Wiki
      - CI=true
    networks:
      - aether-net
      - internal


